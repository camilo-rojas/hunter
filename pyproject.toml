[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hunter"
version = "0.1.0"
description = "Job-hunting service for a RayServer deployment"
requires-python = ">=3.11"
dependencies = [
    "rayserver",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "PyPDF2>=3.0",
    "pyyaml>=6.0",
    "pytz>=2023.0",
    "anthropic>=0.18.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "pytest-timeout>=2.4.0"]

[tool.uv.sources]
rayserver = { git = "https://github.com/camilo-rojas/rayserver.git", tag = "v0.2.0" }

[tool.setuptools.packages.find]
where = ["src"]
